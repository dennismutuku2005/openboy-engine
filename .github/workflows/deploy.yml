name: Deploy OpenBoy Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. BUILD & TEST JOB
  # Runs tests and cross-compiles static Linux AMD64 binary for remote droplet
  # ============================================================================
  build:
    name: Build & Verify Linux Binary
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Compile Linux AMD64 Binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/openboy-engine ./cmd/openboy-engine/main.go
          chmod +x dist/openboy-engine

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openboy-engine-linux
          path: dist/openboy-engine
          retention-days: 1

  # ============================================================================
  # 2. DEPLOY JOB (Uses native OpenSSH + sshpass for 100% Ubuntu 25.04 compatibility)
  # ============================================================================
  deploy:
    name: Deploy to Remote Droplet via PM2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Compiled Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: openboy-engine-linux
          path: ./

      - name: Install OpenSSH Client & sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass openssh-client

      - name: Deploy to Droplet and Restart PM2 on Port 4040
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST || secrets.HOST }}
          DROPLET_USERNAME: ${{ secrets.DROPLET_USERNAME || secrets.USERNAME }}
          DROPLET_PASSWORD: ${{ secrets.DROPLET_PASSWORD || secrets.PASSWORD }}
          DROPLET_PORT: ${{ secrets.DROPLET_PORT || secrets.PORT || '22' }}
        run: |
          # 1. SSH Server port: standard SSH is port 22
          # If the user supplied 4040 (app port) as the droplet SSH port, fallback to 22!
          SSH_PORT="${DROPLET_PORT:-22}"
          if [ "$SSH_PORT" = "4040" ] || [ -z "$SSH_PORT" ]; then
            SSH_PORT=22
          fi

          echo "==> Preparing connection to ${DROPLET_USERNAME}@${DROPLET_HOST} on SSH port ${SSH_PORT}..."
          export SSHPASS="$DROPLET_PASSWORD"

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ServerAliveInterval=15"

          echo "==> Transferring Linux binary and ecosystem.config.js to droplet via SCP..."
          sshpass -e scp -P "$SSH_PORT" $SSH_OPTS openboy-engine ecosystem.config.js "${DROPLET_USERNAME}@${DROPLET_HOST}:/tmp/"

          echo "==> Executing remote PM2 installation and startup on droplet..."
          sshpass -e ssh -p "$SSH_PORT" $SSH_OPTS "${DROPLET_USERNAME}@${DROPLET_HOST}" "bash -s" << 'EOF'
            set -e

            TARGET_DIR="/var/www/openboy-engine"
            if [ ! -w "/var/www" ] && [ "$EUID" -ne 0 ]; then
              TARGET_DIR="$HOME/openboy-engine"
            fi

            echo "==> Deploying OpenBoy Engine into: $TARGET_DIR"
            mkdir -p "$TARGET_DIR"
            mkdir -p "$TARGET_DIR/data"

            chmod +x /tmp/openboy-engine
            mv /tmp/openboy-engine "$TARGET_DIR/openboy-engine"
            if [ -f "/tmp/ecosystem.config.js" ]; then
              mv /tmp/ecosystem.config.js "$TARGET_DIR/ecosystem.config.js"
            fi

            if [ ! -f "$TARGET_DIR/.env" ]; then
              echo "==> Creating initial .env configuration..."
              {
                echo "SERVER_PORT=4040"
                echo "WORKER_COUNT=15"
                echo "DATA_DIR=./data"
                echo "DB_HOST=127.0.0.1"
                echo "DB_PORT=3306"
                echo "DB_USER=root"
                echo "DB_PASSWORD="
                echo "DB_NAME=openboy"
              } > "$TARGET_DIR/.env"
            else
              echo "==> Ensuring SERVER_PORT=4040 in existing .env..."
              if grep -q "^SERVER_PORT=" "$TARGET_DIR/.env"; then
                sed -i 's/^SERVER_PORT=.*/SERVER_PORT=4040/' "$TARGET_DIR/.env"
              else
                echo "SERVER_PORT=4040" >> "$TARGET_DIR/.env"
              fi
            fi

            if ! command -v pm2 &> /dev/null; then
              echo "==> PM2 not found. Installing Node.js & PM2 globally..."
              if command -v npm &> /dev/null; then
                npm install -g pm2 || sudo npm install -g pm2
              elif command -v apt-get &> /dev/null; then
                curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
                sudo apt-get install -y nodejs
                sudo npm install -g pm2
              fi
            fi

            cd "$TARGET_DIR"
            if pm2 describe openboy-engine &> /dev/null; then
              echo "==> Restarting existing PM2 process 'openboy-engine'..."
              pm2 restart openboy-engine --update-env
            else
              echo "==> Starting new PM2 instance for 'openboy-engine' on port 4040..."
              pm2 start ./openboy-engine --name "openboy-engine" -- -port 4040
            fi

            pm2 save

            echo "================================================================="
            echo " SUCCESS: OpenBoy Engine deployed and active under PM2 (Port 4040)"
            echo " Status check: pm2 status openboy-engine"
            echo " Live logs:    pm2 logs openboy-engine"
            echo "================================================================="
          EOF
